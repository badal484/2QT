name: Keep backend warm

on:
  schedule:
    # Every 10 minutes — comfortably inside Render free tier's ~15 min spin-down window.
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: |
          curl -sf --max-time 45 -o /dev/null -w "Backend responded: %{http_code} in %{time_total}s\n" \
            https://api.go2qt.com/api/v1/health
