name: Build & Verify Buyer Release AAB

on:
  workflow_dispatch:
    inputs:
      force_clean:
        description: 'Run gradle clean before build'
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-buyer-aab.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-buyer-aab:
    name: Build Buyer Release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'mobile/package-lock.json'

      - name: Install Mobile Dependencies
        run: |
          cd mobile
          npm ci || npm install

      - name: Setup Java 17 (Zulu)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK & NDK
        run: |
          set -e
          echo "Accepting Android SDK licenses..."
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          echo "Installing SDK platform 36 and build-tools 36.0.0..."
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" || true

      - name: Configure Release Signing & Secrets
        id: signing
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/keystore"

          if [ -n "${{ secrets.MYAPP_RELEASE_STORE_BASE64 }}" ]; then
            echo "::notice::Using official upload keystore from GitHub Secrets."
            echo "${{ secrets.MYAPP_RELEASE_STORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/keystore/release.keystore"
            echo "store_file=$RUNNER_TEMP/keystore/release.keystore" >> "$GITHUB_OUTPUT"
            echo "store_password=${{ secrets.MYAPP_RELEASE_STORE_PASSWORD }}" >> "$GITHUB_OUTPUT"
            echo "key_alias=${{ secrets.MYAPP_RELEASE_KEY_ALIAS }}" >> "$GITHUB_OUTPUT"
            echo "key_password=${{ secrets.MYAPP_RELEASE_KEY_PASSWORD }}" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::MYAPP_RELEASE_STORE_BASE64 is not set in GitHub repository secrets. Generating automated CI upload keystore for build verification..."
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/keystore/release.keystore" \
              -alias "2qt-buyer-upload" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "ci_test_keystore_pass" -keypass "ci_test_keystore_pass" \
              -dname "CN=2QT CI, OU=Mobile, O=Velto, L=Bangalore, ST=KA, C=IN"
            echo "store_file=$RUNNER_TEMP/keystore/release.keystore" >> "$GITHUB_OUTPUT"
            echo "store_password=ci_test_keystore_pass" >> "$GITHUB_OUTPUT"
            echo "key_alias=2qt-buyer-upload" >> "$GITHUB_OUTPUT"
            echo "key_password=ci_test_keystore_pass" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "${{ secrets.GOOGLE_MAPS_API_KEY }}" ]; then
            echo "::notice::Using GOOGLE_MAPS_API_KEY from GitHub Secrets."
            echo "maps_key=${{ secrets.GOOGLE_MAPS_API_KEY }}" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::GOOGLE_MAPS_API_KEY is not set in GitHub repository secrets. Using CI validation key..."
            echo "maps_key=AIzaSyDummyCiVerificationMapsKey00000" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Buyer Release AAB (:app:bundleBuyerRelease)
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError' -Dfile.encoding=UTF-8"
        run: |
          cd mobile/android
          chmod +x gradlew

          if [ "${{ inputs.force_clean }}" = "true" ]; then
            ./gradlew clean
          fi

          ./gradlew :app:bundleBuyerRelease \
            --no-daemon \
            --stacktrace \
            -PMYAPP_RELEASE_STORE_FILE="${{ steps.signing.outputs.store_file }}" \
            -PMYAPP_RELEASE_STORE_PASSWORD="${{ steps.signing.outputs.store_password }}" \
            -PMYAPP_RELEASE_KEY_ALIAS="${{ steps.signing.outputs.key_alias }}" \
            -PMYAPP_RELEASE_KEY_PASSWORD="${{ steps.signing.outputs.key_password }}" \
            -PGOOGLE_MAPS_API_KEY="${{ steps.signing.outputs.maps_key }}"

      - name: Verify Release Artifact & Fingerprints
        run: |
          set -e
          AAB_PATH="mobile/android/app/build/outputs/bundle/buyerRelease/app-buyer-release.aab"
          if [ ! -f "$AAB_PATH" ]; then
            echo "::error::Release AAB file was not generated at $AAB_PATH"
            exit 1
          fi
          echo "=== SUCCESS: Buyer Release AAB Generated ==="
          ls -lh "$AAB_PATH"
          echo "AAB Size: $(du -h "$AAB_PATH" | cut -f1)"

      - name: Upload Buyer Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-buyer-release
          path: mobile/android/app/build/outputs/bundle/buyerRelease/app-buyer-release.aab
          retention-days: 14
          if-no-files-found: error
