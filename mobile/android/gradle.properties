# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# We have increased the memory to 6GB to prevent deadlocks and OutOfMemory errors during C++ native builds!
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=2g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 --add-opens java.base/java.io=ALL-UNNAMED --add-opens java.base/java.lang=ALL-UNNAMED --add-opens java.base/java.util=ALL-UNNAMED --add-opens java.base/java.lang.invoke=ALL-UNNAMED

# Turn off parallel execution to prevent deadlocks during React Native JS Bundling and Android Resource Packaging (aapt2)
org.gradle.parallel=false

# Enable configuring on demand to speed up the initialization step
org.gradle.configureondemand=false

# Disable background daemon persistence to prevent zombie daemon file lock hangs
org.gradle.daemon=false

# React Native specific optimizations
newArchEnabled=true
reactNativeArchitectures=arm64-v8a,x86_64
hermesEnabled=true
android.useAndroidX=true
android.enableJetifier=true
